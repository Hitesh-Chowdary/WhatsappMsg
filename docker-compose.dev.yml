version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: whatsapp_crm_db_dev_instance2
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DB_NAME:-whatsapp_crm}
    volumes:
      - postgres_data_dev_instance2:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: whatsapp_crm_web_dev_instance2
    restart: always
    ports:
      - "8001:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - WHATSAPP_CLIENT_TYPE=${WHATSAPP_CLIENT_TYPE:-mock}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID}
      - META_BUSINESS_ACCOUNT_ID=${META_BUSINESS_ACCOUNT_ID}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      - JWT_SECRET=${JWT_SECRET:-devsecretkeychangeinprod_9f83ea01}
      - META_APP_SECRET=${META_APP_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL}
    volumes:
      # Persistent volume mapping for uploaded media brochures and PDFs
      - media_data_dev_instance2:/app/frontend/static/media

volumes:
  postgres_data_dev_instance2:
  media_data_dev_instance2:
