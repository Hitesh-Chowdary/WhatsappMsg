version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp_crm_web_instance2
    restart: always
    # CRITICAL: Binds container virtual network interface card to the licensed MAC address expected by PyArmor
    mac_address: 44:f7:9f:db:15:c1
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - WHATSAPP_CLIENT_TYPE=${WHATSAPP_CLIENT_TYPE:-meta_cloud}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID}
      - META_BUSINESS_ACCOUNT_ID=${META_BUSINESS_ACCOUNT_ID}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      - JWT_SECRET=${JWT_SECRET:-change_me_to_a_random_secret_in_production}
      - META_APP_SECRET=${META_APP_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL}
    volumes:
      # Persistent volume mapping for uploaded media brochures and PDFs
      - media_data_instance2:/app/frontend/static/media

volumes:
  media_data_instance2:
